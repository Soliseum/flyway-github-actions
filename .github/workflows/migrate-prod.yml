name: Flyway GitHub Actions SQL Server Workflow
on:
  push:
    branches:
      - "main"

# on:
#   push:
#     paths:
#       - migrations/**
# env:
#   FLYWAY_LICENSE_KEY: ${{ secrets.FLYWAY_LICENSE_KEY }} #Repository Secret - Create this within the Projects Settings > Secrets > Actions section
#   # If the first undo script is U002, this will validate all undo scripts up to and including that
#   FIRST_UNDO_SCRIPT: ${{ secrets.FIRST_UNDO_SCRIPT }}
#   # Enable this for additional debug logging
#   ACTIONS_RUNNER_DEBUG: true

#   # JDBC connection string properties
#   JDBC_HOST: ${{ secrets.DB_HOST }}
#   JDBC_PORT: ${{ secrets.DB_PORT }}

jobs:
  flyway-migrate:
    runs-on: self-hosted #ubuntu-latest
    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "main"

      - name: Flyway Migrate
        run: flyway -email=${{ var_USER_EMAIL }} -token=${{ secrets.FLYWAY_TOKEN }} migrate -url="${{ vars.DB_SERVER }};databaseName=${{ vars.DB_NAME_QA }};encrypt=${{ vars.ENCRYPT_BOOL }};integratedSecurity=true;trustServerCertificate=${{ vars.TRUST_CERT_BOOL }}" -IAgreeToTheEula -locations="filesystem:${{ github.workspace }}/migrations" -configFiles="${{ github.workspace }}/flyway.toml" -baselineOnMigrate=true -errorOverrides=S0001:0:I-
        working-directory: ./migrations
        # -baselineVersion=${{ vars.BASELINE_VERSION }}
        # -user=${{ vars.DB_USER_NAME_QA }} -password=${{ secrets.DB_USER_PW_QA }}