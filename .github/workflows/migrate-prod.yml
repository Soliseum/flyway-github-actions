name: Flyway GitHub Actions SQL Server Workflow
on:
  push:
    branches:
      - "main"

env:
  # FLYWAY_LICENSE_KEY: ${{ secrets.FLYWAY_LICENSE_KEY }} #Repository Secret - Create this within the Projects Settings > Secrects > Actions section
  # # If the first undo script is U002, this will validate all undo scripts up to and including that
  # FIRST_UNDO_SCRIPT: ${{ secrets.FIRST_UNDO_SCRIPT }}
  # # Enable this for additional debug logging
  # ACTIONS_RUNNER_DEBUG: true

  # # JDBC connection string properties
  # JDBC_HOST: ${{ secrets.DB_HOST }}
  # JDBC_PORT: ${{ secrets.DB_PORT }}

jobs:
  flyway-migrate:
    runs-on: self-hosted #ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "main"

      - name: Flyway Migrate
        run: flyway migrate
          -url="${{ vars.DB_SERVER }};databaseName=${{ vars.DB_NAME_PROD }};encrypt=${{ vars.ENCRYPT_BOOL }};trustServerCertificate=${{ vars.TRUST_CERT_BOOL }}"
          -user=${{ vars.DB_USER_NAME_PROD }}
          -password=${{ secrets.DB_USER_PW_PROD }}
          -locations="filesystem:${GITHUB_WORKSPACE}/migrations"
          -licenseKey=${{ secrets.FLYWAY_LICENSE_KEY }}
          -baselineOnMigrate=true
          -errorOverrides=S0001:0:I-
          -baselineVersion=${{ vars.BASELINE_VERSION }}
        working-directory: ./migrations
